<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RRJ Travels</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
        }

        .contact-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #ffffff;
            color: #333;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        /* LEFT SIDE INFO */
        .contact-info {
            background:hsl(203, 95%, 22%);
            color: white;
            padding: 40px;
        }

        .contact-info h2 {
            margin-bottom: 20px;
        }

        .contact-info p {
            margin: 15px 0;
            font-size: 14px;
        }

        /* RIGHT SIDE FORM */
        .contact-form {
            padding: 40px;
        }

        .contact-form h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .form-group textarea {
            resize: none;
            height: 120px;
        }

        .btn {
            display: inline-block;
            background:hsl(203, 95%, 22%);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #1ebe5d;
        }

        /* MAP */
        .map {
            margin-top: 40px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        iframe {
            width: 100%;
            height: 300px;
            border: 0;
        }

        /* RESPONSIVE */
        @media(max-width: 768px) {
            .contact-wrapper {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="contact-wrapper">

        <!-- Contact Info -->
        <div class="contact-info">
            <h2>Contact RRJ Travels</h2>
            <p>📍 Tadikalapudi, Andhra Pradesh</p>
            <p>📞 +91 70130 10073</p>        
            <p>✉️ rrjtravels2026@gmail.com</p>
            <p>🕒 24/7 Available for Bookings</p>
        </div>

        <!-- Contact Form -->
        <div class="contact-form">
            <h2>Send a Message</h2>
            <form onsubmit="sendToWhatsApp(); return false;">
                <div class="form-group">
                    <input type="text" id="name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" placeholder="Your Email" required>
                </div>
                <div class="form-group">
                    <input type="text" id="subject" placeholder="Subject">
                </div>
                <div class="form-group">
                    <textarea id="message" placeholder="Your Message" required></textarea>
                </div>
                <button type="submit" class="btn">Send message</button>
            </form>
        </div>

    </div>

    <!-- Google Map -->
    <div class="map">
        <iframe 
            src="https://maps.google.com/maps?q=Tadikalapudi%20Andhra%20Pradesh&t=&z=13&ie=UTF8&iwloc=&output=embed"
            allowfullscreen="">
        </iframe>
    </div>
</div>

<!-- WhatsApp Script -->
<script>
function sendToWhatsApp() {
    var name = document.getElementById("name").value;
    var email = document.getElementById("email").value;
    var subject = document.getElementById("subject").value;
    var message = document.getElementById("message").value;

    var phoneNumber = "917032897465"; // WhatsApp number with country code

    var whatsappMessage = `Hello RRJ Travels,%0A%0A`
        + `Name: ${name}%0A`
        + `Email: ${email}%0A`
        + `Subject: ${subject}%0A`
        + `Message: ${message}`;

    var whatsappURL = `https://wa.me/${phoneNumber}?text=${whatsappMessage}`;

    window.open(whatsappURL, "_blank");
}
</script>

</body>
</html>
